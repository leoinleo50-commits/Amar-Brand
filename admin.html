 <!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amar Brand | Admin Panel — Bulk Delete</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #030712; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div id="toast" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div class="max-w-6xl mx-auto space-y-8">
    <!-- হেডার ও নেভিগেশন -->
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">AMAR BRAND — এডমিন কন্ট্রোল</h1>
        <p class="text-xs text-slate-400">ক্যাটাগরি, প্রোডাক্ট ও রিলস সিলেক্ট করে ডিলিট করুন</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="showSection('categories')" id="nav-categories" class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white">ক্যাটাগরি</button>
        <button onclick="showSection('products')" id="nav-products" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800">প্রোডাক্ট</button>
        <button onclick="showSection('reels')" id="nav-reels" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800">রিলস</button>
        <button onclick="forceClearDefaultSeed()" class="px-3 py-2 rounded-xl text-xs font-semibold bg-amber-950/60 text-amber-300 border border-amber-800/60">ডিফল্ট ডেমো ক্লিন করুন</button>
      </div>
    </div>

    <!-- ১. ক্যাটাগরি সেকশন -->
    <section id="sec-categories" class="space-y-4 bg-slate-900/60 border border-slate-800 rounded-2xl p-5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <h2 class="text-base font-bold">ক্যাটাগরি ম্যানেজার</h2>
          <label class="flex items-center gap-1.5 text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl cursor-pointer">
            <input type="checkbox" id="all-cat" onchange="toggleAll('cat', this.checked)" class="accent-emerald-500" />
            <span>সব সিলেক্ট</span>
          </label>
        </div>
        <button id="btn-del-cat" onclick="bulkDelete('categories')" class="hidden bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold">
          সিলেক্টড ক্যাটাগরি ডিলিট (<span id="cnt-cat">0</span>)
        </button>
      </div>

      <form onsubmit="addCategory(event)" class="flex gap-2 max-w-md">
        <input id="cat-input" type="text" required placeholder="নতুন ক্যাটাগরি নাম" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
        <button class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold">+ যুক্ত করুন</button>
      </form>

      <div id="list-categories" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3"></div>
    </section>

    <!-- ২. প্রোডাক্ট সেকশন -->
    <section id="sec-products" class="hidden space-y-4 bg-slate-900/60 border border-slate-800 rounded-2xl p-5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <h2 class="text-base font-bold">প্রোডাক্ট ম্যানেজার</h2>
          <label class="flex items-center gap-1.5 text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl cursor-pointer">
            <input type="checkbox" id="all-prod" onchange="toggleAll('prod', this.checked)" class="accent-emerald-500" />
            <span>সব সিলেক্ট</span>
          </label>
        </div>
        <button id="btn-del-prod" onclick="bulkDelete('products')" class="hidden bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold">
          সিলেক্টড প্রোডাক্ট ডিলিট (<span id="cnt-prod">0</span>)
        </button>
      </div>

      <div id="list-products" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>

    <!-- ৩. রিলস সেকশন -->
    <section id="sec-reels" class="hidden space-y-4 bg-slate-900/60 border border-slate-800 rounded-2xl p-5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <h2 class="text-base font-bold">রিলস ম্যানেজার</h2>
          <label class="flex items-center gap-1.5 text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl cursor-pointer">
            <input type="checkbox" id="all-reel" onchange="toggleAll('reel', this.checked)" class="accent-emerald-500" />
            <span>সব সিলেক্ট</span>
          </label>
        </div>
        <button id="btn-del-reel" onclick="bulkDelete('reels')" class="hidden bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold">
          সিলেক্টড রিল ডিলিট (<span id="cnt-reel">0</span>)
        </button>
      </div>

      <div id="list-reels" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "amarbrand_admin_state_v6";
    const API_BASE = ""; // আপনার Worker API থাকলে এখানে দিন, যেমন: "https://ind.amar-brand.workers.dev"

    let db = {
      categories: [],
      managedProducts: [],
      managedReels: [],
      deletedIds: { categories: [], products: [], reels: [] }
    };

    let selected = {
      categories: new Set(),
      products: new Set(),
      reels: new Set()
    };

    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }

    function notify(msg) {
      const el = document.createElement("div");
      el.className = "bg-slate-900 border border-emerald-500/60 text-emerald-300 text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg";
      el.textContent = msg;
      document.getElementById("toast").appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          db = {
            categories: Array.isArray(parsed.categories) ? parsed.categories : [],
            managedProducts: Array.isArray(parsed.managedProducts) ? parsed.managedProducts : [],
            managedReels: Array.isArray(parsed.managedReels) ? parsed.managedReels : [],
            deletedIds: parsed.deletedIds || { categories: [], products: [], reels: [] }
          };
        }
      } catch (_) {}
    }

    async function saveDB() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      if (API_BASE) {
        try {
          await fetch(`${API_BASE}/api/admin-sync`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(db)
          });
        } catch (_) {}
      }
    }

    function forceClearDefaultSeed() {
      if (!confirm("সব ক্যাটাগরি, প্রোডাক্ট ও রিল লিস্ট ক্লিয়ার করে ফ্রেশ করতে চান?")) return;
      db.categories = [];
      db.managedProducts = [];
      db.managedReels = [];
      selected.categories.clear();
      selected.products.clear();
      selected.reels.clear();
      saveDB();
      renderAll();
      notify("সব লিস্ট ক্লিয়ার করা হয়েছে");
    }

    function showSection(sec) {
      ["categories", "products", "reels"].forEach(s => {
        document.getElementById(`sec-${s}`).classList.toggle("hidden", s !== sec);
        const btn = document.getElementById(`nav-${s}`);
        btn.className = s === sec
          ? "px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white"
          : "px-4 py-2 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800";
      });
      renderAll();
    }

    function addCategory(e) {
      e.preventDefault();
      const inp = document.getElementById("cat-input");
      const name = inp.value.trim();
      if (!name) return;
      if (!db.categories.includes(name)) db.categories.push(name);
      inp.value = "";
      saveDB();
      renderCategories();
      notify("ক্যাটাগরি যুক্ত হয়েছে");
    }

    function toggleItem(type, id, checked) {
      if (checked) selected[type].add(id);
      else selected[type].delete(id);
      updateBulkUI(type);
    }

    function toggleAll(shortType, checked) {
      const map = { cat: "categories", prod: "products", reel: "reels" };
      const type = map[shortType];
      selected[type].clear();

      if (checked) {
        if (type === "categories") db.categories.forEach(c => selected.categories.add(c));
        if (type === "products") db.managedProducts.forEach(p => selected.products.add(String(p.sku || p.id || p.title)));
        if (type === "reels") db.managedReels.forEach(r => selected.reels.add(String(r.id || r.title)));
      }
      renderAll();
    }

    function updateBulkUI(type) {
      const shortMap = { categories: "cat", products: "prod", reels: "reel" };
      const s = shortMap[type];
      const count = selected[type].size;
      document.getElementById(`cnt-${s}`).textContent = count;
      document.getElementById(`btn-del-${s}`).classList.toggle("hidden", count === 0);
    }

    function bulkDelete(type) {
      const count = selected[type].size;
      if (!count || !confirm(`সিলেক্ট করা ${count} টি আইটেম ডিলিট করবেন?`)) return;

      if (type === "categories") {
        db.deletedIds.categories.push(...selected.categories);
        db.categories = db.categories.filter(c => !selected.categories.has(c));
      }
      if (type === "products") {
        db.deletedIds.products.push(...selected.products);
        db.managedProducts = db.managedProducts.filter(p => !selected.products.has(String(p.sku || p.id || p.title)));
      }
      if (type === "reels") {
        db.deletedIds.reels.push(...selected.reels);
        db.managedReels = db.managedReels.filter(r => !selected.reels.has(String(r.id || r.title)));
      }

      selected[type].clear();
      saveDB();
      renderAll();
      notify(`${count} টি আইটেম ডিলিট করা হয়েছে`);
    }

    function renderCategories() {
      const box = document.getElementById("list-categories");
      if (!db.categories.length) {
        box.innerHTML = `<p class="text-xs text-slate-400 col-span-full">কোনো ক্যাটাগরি নেই।</p>`;
        updateBulkUI("categories");
        return;
      }
      box.innerHTML = db.categories.map(c => {
        const isChecked = selected.categories.has(c);
        return `
          <label class="flex items-center justify-between gap-2 bg-slate-950 border ${isChecked ? 'border-rose-500/70' : 'border-slate-800'} rounded-xl p-3 cursor-pointer">
            <div class="flex items-center gap-2.5 min-w-0">
              <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleItem('categories', '${esc(c)}', this.checked)" class="accent-rose-500" />
              <span class="text-xs font-semibold truncate">${esc(c)}</span>
            </div>
          </label>
        `;
      }).join("");
      updateBulkUI("categories");
    }

    function renderProducts() {
      const box = document.getElementById("list-products");
      if (!db.managedProducts.length) {
        box.innerHTML = `<p class="text-xs text-slate-400 col-span-full">কোনো প্রোডাক্ট নেই।</p>`;
        updateBulkUI("products");
        return;
      }
      box.innerHTML = db.managedProducts.map(p => {
        const pid = String(p.sku || p.id || p.title);
        const isChecked = selected.products.has(pid);
        const img = (Array.isArray(p.images) && p.images[0]) || p.image || "";
        return `
          <label class="block bg-slate-950 border ${isChecked ? 'border-rose-500/70' : 'border-slate-800'} rounded-xl p-3 cursor-pointer space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleItem('products', '${esc(pid)}', this.checked)" class="accent-rose-500" />
                <span class="text-[11px] font-mono text-emerald-400">${esc(pid)}</span>
              </div>
              <span class="text-xs font-bold">৳${esc(p.price || 0)}</span>
            </div>
            ${img ? `<img src="${esc(img)}" class="w-full h-28 object-cover rounded-lg bg-slate-900" />` : ""}
            <p class="text-xs font-semibold truncate">${esc(p.title)}</p>
          </label>
        `;
      }).join("");
      updateBulkUI("products");
    }

    function renderReels() {
      const box = document.getElementById("list-reels");
      if (!db.managedReels.length) {
        box.innerHTML = `<p class="text-xs text-slate-400 col-span-full">কোনো রিল নেই।</p>`;
        updateBulkUI("reels");
        return;
      }
      box.innerHTML = db.managedReels.map(r => {
        const rid = String(r.id || r.title);
        const isChecked = selected.reels.has(rid);
        return `
          <label class="block bg-slate-950 border ${isChecked ? 'border-rose-500/70' : 'border-slate-800'} rounded-xl p-3 cursor-pointer space-y-2">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleItem('reels', '${esc(rid)}', this.checked)" class="accent-rose-500" />
              <span class="text-xs font-semibold truncate">${esc(r.title || rid)}</span>
            </div>
            ${r.poster ? `<img src="${esc(r.poster)}" class="w-full h-32 object-cover rounded-lg bg-slate-900" />` : ""}
          </label>
        `;
      }).join("");
      updateBulkUI("reels");
    }

    function renderAll() {
      renderCategories();
      renderProducts();
      renderReels();
    }

    loadDB();
    renderAll();
  </script>
</body>
</html>
