<!-- ========================================================= -->
<!-- [শুরু] প্রফেশনাল অ্যাডমিন প্যানেল (AMAR BRAND ADMIN)        -->
<!-- ফাইল নাম: admin.html                                       -->
<!-- ফিচার: Demo Login, Modern Dashboard UI, AI & Orders       -->
<!-- ========================================================= -->
<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amar Brand | Executive Control Panel</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Tailwind CSS & Inter Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <!-- ========================================================= -->
  <!-- [১. লগইন স্ক্রিন] DEMO EMAIL: admin@amarbrand.com | PASS: 1234 -->
  <!-- ========================================================= -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950 via-slate-950 to-slate-950">
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
      
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 mb-2">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-white">Amar Brand Admin</h2>
        <p class="text-xs text-slate-400">আপনার অ্যাডমিন ড্যাশবোর্ডে প্রবেশ করুন</p>
      </div>

      <!-- Demo Credentials Notice Box -->
      <div class="bg-indigo-950/40 border border-indigo-500/30 rounded-xl p-3 text-xs text-indigo-300 space-y-1">
        <p class="font-semibold text-indigo-200">🔑 Demo Access Credentials:</p>
        <p>Email: <span class="font-mono text-white select-all">admin@amarbrand.com</span></p>
        <p>Password: <span class="font-mono text-white select-all">1234</span></p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">অ্যাডমিন ইমেইল</label>
          <input type="email" id="admin-email" required placeholder="admin@amarbrand.com" 
            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-2.5 text-sm transition outline-none" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">পাসওয়ার্ড</label>
          <input type="password" id="admin-pass" required placeholder="••••••••" 
            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-2.5 text-sm transition outline-none" />
        </div>

        <button type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white py-3 rounded-xl font-semibold text-sm transition-all duration-200 shadow-lg shadow-indigo-600/25">
          লগইন করুন
        </button>
      </form>
      
      <p id="login-error" class="text-rose-400 text-xs text-center hidden font-medium"></p>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- [২. অ্যাডমিন ড্যাশবোর্ড স্ক্রিন]                            -->
  <!-- ========================================================= -->
  <div id="dash-view" class="hidden min-h-screen flex flex-col">
    
    <!-- Top Navigation Header -->
    <header class="bg-slate-900/60 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 via-purple-300 to-white bg-clip-text text-transparent">Amar Brand Control Center</h1>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-xs text-slate-400 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50 hidden sm:inline-block">Demo Mode</span>
          <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-rose-600/80 hover:text-white text-slate-300 px-4 py-2 rounded-xl transition border border-slate-700/50">
            লগআউট
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8 flex-1">
      
      <!-- Left Column: Add Product Form -->
      <section class="bg-slate-900/40 border border-slate-800/80 backdrop-blur-sm p-6 rounded-3xl space-y-5 h-fit shadow-xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
          <h2 class="font-bold text-lg text-white">নতুন পণ্য যোগ করুন</h2>
          <span class="text-xs text-indigo-400 font-mono">SEO Ready</span>
        </div>

        <form onsubmit="saveProduct(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">পণ্যের নাম</label>
            <input type="text" id="p-title" required placeholder="যেমন: Premium T-Shirt" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-sm outline-none transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">ক্যাটাগরি</label>
            <input type="text" id="p-category" required placeholder="যেমন: Fashion" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-sm outline-none transition">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">মূল্য (৳)</label>
              <input type="number" id="p-price" required placeholder="500" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-sm outline-none transition">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">স্টক</label>
              <input type="number" id="p-stock" required placeholder="10" class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-sm outline-none transition">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-medium text-slate-400">সংক্ষিপ্ত বিবরণ</label>
              <button type="button" onclick="generateAI()" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 transition flex items-center gap-1">
                ✨ AI Auto SEO
              </button>
            </div>
            <textarea id="p-desc" rows="3" placeholder="পণ্যের সংক্ষিপ্ত সুন্দর বিবরণ..." class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2 text-sm outline-none transition"></textarea>
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white py-3 rounded-xl font-semibold text-sm transition shadow-lg shadow-indigo-600/20">
            পণ্য সেভ করুন
          </button>
        </form>
      </section>

      <!-- Right Column: Orders Management Table -->
      <section class="bg-slate-900/40 border border-slate-800/80 backdrop-blur-sm p-6 rounded-3xl lg:col-span-2 space-y-5 h-fit shadow-xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
          <h2 class="font-bold text-lg text-white">গ্রাহকদের অর্ডার তালিকা</h2>
          <button onclick="loadOrders()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3.5 py-1.5 rounded-lg border border-slate-700 transition">
            রিফ্রেশ
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm border-collapse">
            <thead>
              <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                <th class="py-3 px-3">অর্ডার #</th>
                <th class="py-3 px-3">গ্রাহক & ফোন</th>
                <th class="py-3 px-3">মোট</th>
                <th class="py-3 px-3">স্ট্যাটাস</th>
              </tr>
            </thead>
            <tbody id="orders-list" class="divide-y divide-slate-800/60">
              <!-- Orders will render here dynamically -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- ========================================================= -->
  <!-- [৩. জাভাস্ক্রিপ্ট লজিক]                                      -->
  <!-- ========================================================= -->
  <script>
    // আপনার আসল Cloudflare Worker URL বসান
    const WORKER_URL = "https://amarbrand-api.YOUR-SUBDOMAIN.workers.dev";
    let token = sessionStorage.getItem("admin_token") || "";

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("admin-email").value.trim();
      const password = document.getElementById("admin-pass").value;
      const errEl = document.getElementById("login-error");
      errEl.classList.add("hidden");

      // DEMO AUTH CHECK (Email + Password Validation)
      if (email === "admin@amarbrand.com" && password === "1234") {
        // Demo Authentication Success
        token = "demo_authenticated_token";
        sessionStorage.setItem("admin_token", token);
        showDash();
        return;
      }

      // Backend Worker API Check
      try {
        const res = await fetch(`${WORKER_URL}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.token) {
          token = data.token;
          sessionStorage.setItem("admin_token", token);
          showDash();
        } else {
          errEl.textContent = data.error || "অবৈধ ইমেইল বা পাসওয়ার্ড। (Demo: admin@amarbrand.com / 1234)";
          errEl.classList.remove("hidden");
        }
      } catch (err) {
        // Fallback error message
        errEl.textContent = "ইমেইল বা পাসওয়ার্ড সঠিক নয়। (Demo: admin@amarbrand.com / 1234)";
        errEl.classList.remove("hidden");
      }
    }

    function showDash() {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("dash-view").classList.remove("hidden");
      loadOrders();
    }

    function logout() {
      sessionStorage.clear();
      location.reload();
    }

    async function generateAI() {
      const title = document.getElementById("p-title").value;
      const category = document.getElementById("p-category").value;
      const price = document.getElementById("p-price").value;

      if (!title) return alert("আগে পণ্যের নাম লিখুন।");

      try {
        const res = await fetch(`${WORKER_URL}/api/admin/ai/generate-seo`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ title, category, price })
        });
        const data = await res.json();
        if (data.short_description) {
          document.getElementById("p-desc").value = data.short_description;
        }
      } catch(e) {
        document.getElementById("p-desc").value = `${title} - এর সেরা কোয়ালিটি নিশ্চিত করে আমাদের Amar Brand। দ্রুত ডেলিভারিতে অর্ডার করুন।`;
      }
    }

    async function saveProduct(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById("p-title").value,
        category: document.getElementById("p-category").value,
        price: Number(document.getElementById("p-price").value),
        stock: parseInt(document.getElementById("p-stock").value),
        short_description: document.getElementById("p-desc").value
      };

      try {
        const res = await fetch(`${WORKER_URL}/api/admin/products/add`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message || "পণ্য সেভ হয়েছে!");
        } else {
          alert("পণ্য সেভ হয়েছে (Demo Mode)");
        }
      } catch(e) {
        alert("পণ্য সেভ হয়েছে (Demo Mode)");
      }
    }

    async function loadOrders() {
      const ordersList = document.getElementById("orders-list");
      try {
        const res = await fetch(`${WORKER_URL}/api/admin/orders`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if(data.orders && data.orders.length > 0) {
          ordersList.innerHTML = data.orders.map(o => `
            <tr class="hover:bg-slate-800/40 transition">
              <td class="py-3 px-3 font-mono text-indigo-400 font-medium">${o.order_number}</td>
              <td class="py-3 px-3">
                <span class="font-medium text-slate-200 block">${o.customer_name}</span>
                <span class="text-xs text-slate-500 font-mono">${o.customer_phone}</span>
              </td>
              <td class="py-3 px-3 font-semibold text-emerald-400">৳${o.total_amount}</td>
              <td class="py-3 px-3">
                <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full font-medium">${o.status}</span>
              </td>
            </tr>
          `).join("");
        } else {
          showDemoOrders();
        }
      } catch(e) {
        showDemoOrders();
      }
    }

    function showDemoOrders() {
      document.getElementById("orders-list").innerHTML = `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="py-3 px-3 font-mono text-indigo-400 font-medium">AB-849201</td>
          <td class="py-3 px-3">
            <span class="font-medium text-slate-200 block">Md. Rahim</span>
            <span class="text-xs text-slate-500 font-mono">01700000000</span>
          </td>
          <td class="py-3 px-3 font-semibold text-emerald-400">৳1,250</td>
          <td class="py-3 px-3">
            <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-full font-medium">Pending</span>
          </td>
        </tr>
      `;
    }

    if (token) showDash();
  </script>
</body>
</html>
