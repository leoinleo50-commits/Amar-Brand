 <!-- ========================================================= -->
<!-- [শুরু] AMAR BRAND STORE — এডমিন ড্যাশবোর্ড (Full Sync)     -->
<!-- ========================================================= -->
<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amar Brand | Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #030712; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(30, 41, 59, 0.8); }
    .nav-active { background-color: #1e293b; color: #34d399; border-left: 4px solid #10b981; font-weight: 700; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen antialiased flex flex-col md:flex-row">

  <div id="toast-container" class="fixed top-5 right-5 z-[70] flex flex-col gap-2 max-w-sm w-full"></div>

  <!-- সাইডবার -->
  <aside class="w-full md:w-64 bg-slate-950 border-r border-slate-800/80 p-4 shrink-0 flex flex-col justify-between">
    <div class="space-y-6">
      <div class="flex items-center gap-3 px-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center font-extrabold text-white text-sm">AB</div>
        <div>
          <h2 class="text-sm font-extrabold text-white">AMAR BRAND</h2>
          <p class="text-[10px] text-emerald-400 font-mono">Admin Sync v6.3</p>
        </div>
      </div>

      <nav class="space-y-1 text-xs">
        <button onclick="switchTab('products')" id="tab-btn-products" class="w-full text-left px-3.5 py-2.5 rounded-xl transition flex items-center gap-2.5 hover:bg-slate-900 text-slate-300">
          <span>🛍️</span> <span>প্রোডাক্ট ও ক্যাটাগরি</span>
        </button>
        <button onclick="switchTab('reels')" id="tab-btn-reels" class="w-full text-left px-3.5 py-2.5 rounded-xl transition flex items-center gap-2.5 hover:bg-slate-900 text-slate-300">
          <span>🎬</span> <span>শপ্যাবল রিলস</span>
        </button>
        <button onclick="switchTab('orders')" id="tab-btn-orders" class="w-full text-left px-3.5 py-2.5 rounded-xl transition flex items-center gap-2.5 hover:bg-slate-900 text-slate-300 justify-between">
          <div class="flex items-center gap-2.5"><span>📦</span> <span>অর্ডারসমূহ</span></div>
          <span id="badge-orders-count" class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-mono text-[10px]">0</span>
        </button>
      </nav>
    </div>

    <div class="pt-4 border-t border-slate-800/80 space-y-2">
      <button onclick="resetAllStoreData()" class="w-full bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 py-2 rounded-xl text-xs font-semibold transition">
        ♻️ স্টেট রিসেট (Clean Sync)
      </button>
      <a href="index.html" target="_blank" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-200 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition border border-slate-800">
        <span>🌐</span> <span>স্টোরফ্রন্ট দেখুন</span>
      </a>
    </div>
  </aside>

  <!-- প্রধান কন্টেন্ট -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-7xl mx-auto space-y-6">

    <!-- প্রোডাক্ট ও ক্যাটাগরি ট্যাব -->
    <section id="view-products" class="space-y-6">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <h2 class="text-xl font-bold text-white">প্রোডাক্ট ও ক্যাটাগরি কন্ট্রোল</h2>
        <div class="flex items-center gap-2">
          <button id="btn-bulk-delete-prod" onclick="bulkDeleteProducts()" class="hidden bg-rose-600 hover:bg-rose-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
            🗑️ সিলেক্টড প্রোডাক্ট ডিলিট (<span id="count-selected-prod">0</span>)
          </button>
          <button onclick="openProductModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">+ নতুন প্রোডাক্ট</button>
        </div>
      </div>

      <!-- ক্যাটাগরি -->
      <div class="glass-card p-4 rounded-2xl space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-3">
            <h3 class="text-sm font-bold text-slate-200">স্টোর ক্যাটাগরিসমূহ</h3>
            <label class="flex items-center gap-1.5 text-xs text-slate-300 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-xl cursor-pointer">
              <input type="checkbox" id="chk-all-categories" onchange="toggleSelectAllCategories(this)" class="accent-amber-500 cursor-pointer" />
              <span>সব সিলেক্ট</span>
            </label>
          </div>
          <button id="btn-bulk-delete-cat" onclick="bulkDeleteCategories()" class="hidden bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">
            🗑️ সিলেক্টড ক্যাটাগরি ডিলিট (<span id="count-selected-cat">0</span>)
          </button>
        </div>

        <div id="category-chips-list" class="flex flex-wrap gap-2"></div>

        <form onsubmit="addCategory(event)" class="flex gap-2 max-w-sm pt-2">
          <input type="text" id="new-cat-input" required placeholder="নতুন ক্যাটাগরি নাম" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs outline-none focus:border-emerald-500" />
          <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold">+ যোগ করুন</button>
        </form>
      </div>

      <!-- প্রোডাক্ট টেবিল -->
      <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
              <tr>
                <th class="p-3 w-10 text-center">
                  <input type="checkbox" id="chk-all-products" onchange="toggleSelectAllProducts(this)" class="accent-emerald-500 cursor-pointer" />
                </th>
                <th class="p-3">SKU / কোড</th>
                <th class="p-3">টাইটেল</th>
                <th class="p-3">ক্যাটাগরি</th>
                <th class="p-3">মূল্য</th>
                <th class="p-3">স্টক</th>
                <th class="p-3">অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="products-table-body" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- শপ্যাবল রিলস ট্যাব -->
    <section id="view-reels" class="hidden space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <h2 class="text-xl font-bold text-white">শপ্যাবল রিল ভিডিও ম্যানেজমেন্ট</h2>
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-2 text-xs text-slate-300 bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl cursor-pointer">
            <input type="checkbox" id="chk-all-reels" onchange="toggleSelectAllReels(this)" class="accent-pink-500" />
            <span>সব সিলেক্ট</span>
          </label>
          <button id="btn-bulk-delete-reels" onclick="bulkDeleteReels()" class="hidden bg-rose-600 hover:bg-rose-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
            🗑️ সিলেক্টড রিল ডিলিট (<span id="count-selected-reels">0</span>)
          </button>
          <button onclick="openReelModal()" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">+ রিল আপলোড / যুক্ত করুন</button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="reels-admin-grid"></div>
    </section>

    <!-- অর্ডার ট্যাব -->
    <section id="view-orders" class="hidden space-y-4">
      <h2 class="text-xl font-bold text-white">অর্ডারসমূহ</h2>
      <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
              <tr>
                <th class="p-3">অর্ডার #</th>
                <th class="p-3">গ্রাহক</th>
                <th class="p-3">ঠিকানা</th>
                <th class="p-3">সর্বমোট</th>
                <th class="p-3">স্ট্যাটাস</th>
              </tr>
            </thead>
            <tbody id="orders-table-body" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- প্রোডাক্ট মোডাল -->
  <div id="modal-product" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="text-base font-bold text-white">প্রোডাক্ট যুক্ত/এডিট করুন</h3>
        <button onclick="closeProductModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <form onsubmit="saveProductSubmit(event)" class="space-y-3 text-xs">
        <input type="hidden" id="pm-old-sku" />
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">SKU / কোড *</label>
            <input type="text" id="pm-sku" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none font-mono" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">ক্যাটাগরি *</label>
            <select id="pm-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none"></select>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">প্রোডাক্টের নাম *</label>
          <input type="text" id="pm-title" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1">বিক্রি মূল্য (৳) *</label>
            <input type="number" id="pm-price" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none font-mono" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">স্টক *</label>
            <input type="number" id="pm-stock" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none font-mono" />
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">ছবি URL (কমা দিয়ে আলাদা করুন)</label>
          <input type="text" id="pm-images" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none font-mono" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl">সেভ করুন</button>
      </form>
    </div>
  </div>

  <!-- রিল আপলোড / যুক্ত করার মোডাল (ফাইল আপলোড + URL উভয়ই) -->
  <div id="modal-reel" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="text-base font-bold text-white">রিল ভিডিও আপলোড / যুক্ত করুন</h3>
        <button onclick="closeReelModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <form onsubmit="saveReelSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">রিল শিরোনাম *</label>
          <input type="text" id="rm-title" required placeholder="Product Demo Reel" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none" />
        </div>
        <div>
          <label class="block text-slate-400 mb-1">সংযুক্ত প্রোডাক্ট কোড (SKU) *</label>
          <input type="text" id="rm-sku" required placeholder="AB-PRD-1001" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none font-mono" />
        </div>
        <div>
          <label class="block text-slate-400 mb-1">ডিভাইস থেকে ভিডিও ফাইল আপলোড (.mp4/.webm)</label>
          <input type="file" id="rm-video-file" accept="video/*" onchange="handleReelFileUpload(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-[11px] file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-pink-600 file:text-white" />
        </div>
        <div>
          <label class="block text-slate-400 mb-1">অথবা ভিডিও ফাইল URL (.mp4)</label>
          <input type="url" id="rm-video-url" placeholder="https://example.com/video.mp4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none font-mono" />
        </div>
        <div>
          <label class="block text-slate-400 mb-1">পোস্টার ছবি URL</label>
          <input type="url" id="rm-poster-url" placeholder="https://example.com/poster.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 outline-none font-mono" />
        </div>
        <button type="submit" class="w-full bg-pink-600 text-white font-bold py-2.5 rounded-xl">রিল পাবলিশ করুন</button>
      </form>
    </div>
  </div>

  <script>
    const ADMIN_STORAGE_KEY = "amarbrand_admin_state_v6";
    const ORDERS_STORAGE_KEY = "amarbrand_visitor_orders_v1";

    let state = {
      categories: ["Organic & Natural", "Apparel", "Accessories", "Home Essentials"],
      managedProducts: [],
      managedReels: [],
      managedOrders: [],
      incompleteOrders: [],
      chatThreads: [],
      initializedByAdmin: true
    };

    let uploadedReelDataUrl = "";
    let selectedCatNames = new Set();
    let selectedProdSkus = new Set();
    let selectedReelIds = new Set();

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function showToast(msg) {
      const box = document.getElementById("toast-container");
      const el = document.createElement("div");
      el.className = "bg-slate-900 border border-emerald-500 text-emerald-300 px-4 py-2.5 rounded-xl text-xs font-semibold shadow-xl";
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    function loadAdminState() {
      try {
        const raw = localStorage.getItem(ADMIN_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            ...state,
            ...parsed,
            categories: Array.isArray(parsed.categories) ? parsed.categories : state.categories,
            managedProducts: Array.isArray(parsed.managedProducts) ? parsed.managedProducts : [],
            managedReels: Array.isArray(parsed.managedReels) ? parsed.managedReels : [],
            managedOrders: Array.isArray(parsed.managedOrders) ? parsed.managedOrders : [],
            initializedByAdmin: true
          };
        }
        const localOrders = JSON.parse(localStorage.getItem(ORDERS_STORAGE_KEY) || "[]");
        if (localOrders.length) {
          const map = new Map();
          [...state.managedOrders, ...localOrders].forEach(o => o && map.set(o.order_number, o));
          state.managedOrders = Array.from(map.values());
        }
      } catch (_) {}
      saveState();
      document.getElementById("badge-orders-count").textContent = state.managedOrders.length;
    }

    function saveState() {
      state.initializedByAdmin = true;
      try {
        localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(state));
        localStorage.setItem(ORDERS_STORAGE_KEY, JSON.stringify(state.managedOrders));
      } catch (err) {
        showToast("স্টোরেজ লিমিট পূর্ণ হয়েছে—ছোট ভিডিও বা URL ব্যবহার করুন");
      }
      document.getElementById("badge-orders-count").textContent = state.managedOrders.length;
    }

    function resetAllStoreData() {
      if (!confirm("সব স্টেট সিঙ্ক আপডেট করতে চান?")) return;
      saveState();
      renderCategoryChips();
      renderProductsTable();
      renderReelsGrid();
      showToast("স্টোরফ্রন্টের সাথে সিঙ্ক আপডেট হয়েছে");
    }

    function switchTab(tabId) {
      ["products", "reels", "orders"].forEach(t => {
        document.getElementById(`view-${t}`)?.classList.add("hidden");
        document.getElementById(`tab-btn-${t}`)?.classList.remove("nav-active");
      });
      document.getElementById(`view-${tabId}`)?.classList.remove("hidden");
      document.getElementById(`tab-btn-${tabId}`)?.classList.add("nav-active");

      if (tabId === "products") { renderCategoryChips(); renderProductsTable(); }
      if (tabId === "reels") renderReelsGrid();
      if (tabId === "orders") renderOrdersTable();
    }

    /* ক্যাটাগরি */
    function renderCategoryChips() {
      const box = document.getElementById("category-chips-list");
      selectedCatNames.clear();
      updateCatBulkBtn();
      const chkAll = document.getElementById("chk-all-categories");
      if (chkAll) chkAll.checked = false;

      if (!state.categories.length) {
        box.innerHTML = `<p class="text-xs text-slate-500">কোনো ক্যাটাগরি নেই।</p>`;
        return;
      }
      box.innerHTML = state.categories.map((c, idx) => `
        <div class="bg-slate-900 border border-slate-800 text-slate-200 px-3 py-1.5 rounded-xl text-xs flex items-center gap-2">
          <input type="checkbox" value="${escapeHtml(c)}" onchange="toggleSelectCategory('${escapeHtml(c)}', this.checked)" class="chk-cat-item accent-amber-500 cursor-pointer" />
          <span>${escapeHtml(c)}</span>
          <button type="button" onclick="removeCategory(${idx})" class="text-slate-500 hover:text-rose-400 ml-1">✕</button>
        </div>
      `).join("");
    }

    function toggleSelectCategory(catName, checked) {
      if (checked) selectedCatNames.add(catName); else selectedCatNames.delete(catName);
      updateCatBulkBtn();
    }

    function toggleSelectAllCategories(masterChk) {
      document.querySelectorAll(".chk-cat-item").forEach(cb => {
        cb.checked = masterChk.checked;
        if (masterChk.checked) selectedCatNames.add(cb.value); else selectedCatNames.delete(cb.value);
      });
      updateCatBulkBtn();
    }

    function updateCatBulkBtn() {
      const btn = document.getElementById("btn-bulk-delete-cat");
      document.getElementById("count-selected-cat").textContent = selectedCatNames.size;
      btn.classList.toggle("hidden", selectedCatNames.size === 0);
    }

    function bulkDeleteCategories() {
      if (!selectedCatNames.size || !confirm(`${selectedCatNames.size} টি ক্যাটাগরি ডিলিট করবেন?`)) return;
      state.categories = state.categories.filter(c => !selectedCatNames.has(c));
      saveState();
      renderCategoryChips();
      showToast("সিলেক্টড ক্যাটাগরি ডিলিট হয়েছে");
    }

    function addCategory(e) {
      e.preventDefault();
      const inp = document.getElementById("new-cat-input");
      const name = inp.value.trim();
      if (name && !state.categories.includes(name)) {
        state.categories.push(name);
        saveState();
        inp.value = "";
        renderCategoryChips();
        showToast("ক্যাটাগরি যুক্ত হয়েছে");
      }
    }

    function removeCategory(idx) {
      if (!confirm("ক্যাটাগরিটি ডিলিট করবেন?")) return;
      state.categories.splice(idx, 1);
      saveState();
      renderCategoryChips();
      showToast("ক্যাটাগরি ডিলিট হয়েছে");
    }

    /* প্রোডাক্ট */
    function renderProductsTable() {
      const tbody = document.getElementById("products-table-body");
      selectedProdSkus.clear();
      updateProdBulkBtn();
      const chkAll = document.getElementById("chk-all-products");
      if (chkAll) chkAll.checked = false;

      if (!state.managedProducts.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-500">কোনো প্রোডাক্ট নেই।</td></tr>`;
        return;
      }
      tbody.innerHTML = state.managedProducts.map(p => `
        <tr class="hover:bg-slate-900/50">
          <td class="p-3 text-center"><input type="checkbox" value="${escapeHtml(p.sku)}" onchange="toggleSelectProduct('${escapeHtml(p.sku)}', this.checked)" class="chk-prod-item accent-emerald-500 cursor-pointer" /></td>
          <td class="p-3 font-mono text-emerald-400">${escapeHtml(p.sku)}</td>
          <td class="p-3 font-semibold text-white">${escapeHtml(p.title)}</td>
          <td class="p-3 text-slate-400">${escapeHtml(p.category)}</td>
          <td class="p-3 font-mono text-white">৳${escapeHtml(p.price)}</td>
          <td class="p-3 font-mono text-slate-300">${escapeHtml(p.stock)}</td>
          <td class="p-3 space-x-2">
            <button onclick="openProductModal('${escapeHtml(p.sku)}')" class="text-sky-400 hover:underline">এডিট</button>
            <button onclick="deleteProduct('${escapeHtml(p.sku)}')" class="text-rose-400 hover:underline">ডিলিট</button>
          </td>
        </tr>
      `).join("");
    }

    function toggleSelectProduct(sku, checked) {
      if (checked) selectedProdSkus.add(sku); else selectedProdSkus.delete(sku);
      updateProdBulkBtn();
    }

    function toggleSelectAllProducts(masterChk) {
      document.querySelectorAll(".chk-prod-item").forEach(cb => {
        cb.checked = masterChk.checked;
        if (masterChk.checked) selectedProdSkus.add(cb.value); else selectedProdSkus.delete(cb.value);
      });
      updateProdBulkBtn();
    }

    function updateProdBulkBtn() {
      const btn = document.getElementById("btn-bulk-delete-prod");
      document.getElementById("count-selected-prod").textContent = selectedProdSkus.size;
      btn.classList.toggle("hidden", selectedProdSkus.size === 0);
    }

    function bulkDeleteProducts() {
      if (!selectedProdSkus.size || !confirm(`${selectedProdSkus.size} টি প্রোডাক্ট ডিলিট করবেন?`)) return;
      state.managedProducts = state.managedProducts.filter(p => !selectedProdSkus.has(p.sku));
      saveState();
      renderProductsTable();
      showToast("সিলেক্টড প্রোডাক্ট ডিলিট হয়েছে");
    }

    function deleteProduct(sku) {
      if (!confirm("প্রোডাক্টটি ডিলিট করবেন?")) return;
      state.managedProducts = state.managedProducts.filter(p => p.sku !== sku);
      saveState();
      renderProductsTable();
      showToast("প্রোডাক্ট ডিলিট হয়েছে");
    }

    function openProductModal(sku = null) {
      const modal = document.getElementById("modal-product");
      const catSelect = document.getElementById("pm-category");
      catSelect.innerHTML = state.categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
      if (sku) {
        const prod = state.managedProducts.find(p => p.sku === sku);
        if (prod) {
          document.getElementById("pm-old-sku").value = prod.sku;
          document.getElementById("pm-sku").value = prod.sku;
          document.getElementById("pm-title").value = prod.title;
          document.getElementById("pm-category").value = prod.category;
          document.getElementById("pm-price").value = prod.price;
          document.getElementById("pm-stock").value = prod.stock;
          document.getElementById("pm-images").value = (prod.images || []).join(", ");
        }
      } else {
        document.getElementById("pm-old-sku").value = "";
        document.getElementById("pm-sku").value = "AB-PRD-" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById("pm-title").value = "";
        document.getElementById("pm-price").value = "";
        document.getElementById("pm-stock").value = "50";
        document.getElementById("pm-images").value = "";
      }
      modal.classList.remove("hidden");
    }

    function closeProductModal() { document.getElementById("modal-product").classList.add("hidden"); }

    function saveProductSubmit(e) {
      e.preventDefault();
      const oldSku = document.getElementById("pm-old-sku").value;
      const sku = document.getElementById("pm-sku").value.trim();
      const prod = {
        sku,
        title: document.getElementById("pm-title").value.trim(),
        category: document.getElementById("pm-category").value,
        price: Number(document.getElementById("pm-price").value),
        stock: Number(document.getElementById("pm-stock").value),
        images: document.getElementById("pm-images").value.split(",").map(s => s.trim()).filter(Boolean),
        status: "Active"
      };
      if (oldSku) {
        const idx = state.managedProducts.findIndex(p => p.sku === oldSku);
        if (idx >= 0) state.managedProducts[idx] = prod;
      } else {
        state.managedProducts.unshift(prod);
      }
      saveState();
      closeProductModal();
      renderProductsTable();
      showToast("প্রোডাক্ট সেভ হয়েছে");
    }

    /* রিলস */
    function handleReelFileUpload(input) {
      const file = input.files?.[0];
      if (!file) { uploadedReelDataUrl = ""; return; }
      const reader = new FileReader();
      reader.onload = () => {
        uploadedReelDataUrl = String(reader.result || "");
        showToast("ভিডিও ফাইল সিলেক্ট হয়েছে");
      };
      reader.readAsDataURL(file);
    }

    function renderReelsGrid() {
      const box = document.getElementById("reels-admin-grid");
      selectedReelIds.clear();
      updateReelBulkBtn();
      const chkAll = document.getElementById("chk-all-reels");
      if (chkAll) chkAll.checked = false;

      if (!state.managedReels.length) {
        box.innerHTML = `<div class="col-span-full p-8 text-center text-slate-500">কোনো রিল ভিডিও নেই।</div>`;
        return;
      }
      box.innerHTML = state.managedReels.map(r => `
        <div class="glass-card p-3 rounded-2xl space-y-2 relative">
          <div class="absolute top-4 left-4 z-10">
            <input type="checkbox" value="${escapeHtml(r.id)}" onchange="toggleSelectReel('${escapeHtml(r.id)}', this.checked)" class="chk-reel-item w-4 h-4 accent-pink-500 cursor-pointer" />
          </div>
          <video src="${escapeHtml(r.video_src)}" poster="${escapeHtml(r.poster || '')}" controls class="w-full h-40 object-cover rounded-xl bg-black"></video>
          <p class="font-bold text-xs text-white truncate">${escapeHtml(r.title)}</p>
          <p class="text-[10px] font-mono text-pink-300">SKU: ${escapeHtml(r.product_code)}</p>
          <button onclick="deleteReel('${escapeHtml(r.id)}')" class="w-full bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 py-1 rounded-xl text-xs transition">ডিলিট</button>
        </div>
      `).join("");
    }

    function toggleSelectReel(id, checked) {
      if (checked) selectedReelIds.add(id); else selectedReelIds.delete(id);
      updateReelBulkBtn();
    }

    function toggleSelectAllReels(masterChk) {
      document.querySelectorAll(".chk-reel-item").forEach(cb => {
        cb.checked = masterChk.checked;
        if (masterChk.checked) selectedReelIds.add(cb.value); else selectedReelIds.delete(cb.value);
      });
      updateReelBulkBtn();
    }

    function updateReelBulkBtn() {
      const btn = document.getElementById("btn-bulk-delete-reels");
      document.getElementById("count-selected-reels").textContent = selectedReelIds.size;
      btn.classList.toggle("hidden", selectedReelIds.size === 0);
    }

    function bulkDeleteReels() {
      if (!selectedReelIds.size || !confirm(`${selectedReelIds.size} টি রিল ডিলিট করবেন?`)) return;
      state.managedReels = state.managedReels.filter(r => !selectedReelIds.has(r.id));
      saveState();
      renderReelsGrid();
      showToast("সিলেক্টড রিল ডিলিট হয়েছে");
    }

    function openReelModal() {
      uploadedReelDataUrl = "";
      document.getElementById("rm-video-file").value = "";
      document.getElementById("rm-video-url").value = "";
      document.getElementById("modal-reel").classList.remove("hidden");
    }
    function closeReelModal() { document.getElementById("modal-reel").classList.add("hidden"); }

    function saveReelSubmit(e) {
      e.preventDefault();
      const videoSrc = uploadedReelDataUrl || document.getElementById("rm-video-url").value.trim();
      if (!videoSrc) { showToast("ভিডিও ফাইল বা URL দিন"); return; }
      const reel = {
        id: "REEL-" + Math.floor(100 + Math.random() * 900),
        title: document.getElementById("rm-title").value.trim(),
        product_code: document.getElementById("rm-sku").value.trim(),
        video_src: videoSrc,
        poster: document.getElementById("rm-poster-url").value.trim(),
        caption: document.getElementById("rm-title").value.trim()
      };
      state.managedReels.unshift(reel);
      saveState();
      closeReelModal();
      renderReelsGrid();
      showToast("রিল পাবলিশ হয়েছে");
    }

    function deleteReel(id) {
      if (!confirm("রিলটি ডিলিট করবেন?")) return;
      state.managedReels = state.managedReels.filter(r => r.id !== id);
      saveState();
      renderReelsGrid();
      showToast("রিল ডিলিট হয়েছে");
    }

    function renderOrdersTable() {
      const tbody = document.getElementById("orders-table-body");
      if (!state.managedOrders.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">কোনো অর্ডার নেই।</td></tr>`;
        return;
      }
      tbody.innerHTML = state.managedOrders.map(o => `
        <tr>
          <td class="p-3 font-mono text-emerald-400">#${escapeHtml(o.order_number)}</td>
          <td class="p-3">${escapeHtml(o.customer_name)}</td>
          <td class="p-3">${escapeHtml(o.shipping_address)}</td>
          <td class="p-3 font-mono">৳${escapeHtml(o.total_amount)}</td>
          <td class="p-3">${escapeHtml(o.status)}</td>
        </tr>
      `).join("");
    }

    (function init() {
      loadAdminState();
      switchTab("products");
    })();
  </script>
</body>
</html>
